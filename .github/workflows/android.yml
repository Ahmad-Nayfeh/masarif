name: Android CI

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: "تحديث لقطات الشاشة في docs/screenshots من المحاكي"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: اختبارات الوحدة + بناء APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.MASARIF_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Decode release keystore (if secrets are set)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/masarif-release.jks"
          echo "MASARIF_KEYSTORE_FILE=$RUNNER_TEMP/masarif-release.jks" >> "$GITHUB_ENV"

      - name: Build APKs (release signed with secrets keystore or debug key)
        env:
          MASARIF_KEYSTORE_PASSWORD: ${{ secrets.MASARIF_KEYSTORE_PASSWORD }}
          MASARIF_KEY_ALIAS: ${{ secrets.MASARIF_KEY_ALIAS }}
          MASARIF_KEY_PASSWORD: ${{ secrets.MASARIF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/masarif-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/masarif-debug.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: masarif-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

  emulator:
    name: محاكي — SMS باسم alinma والتطبيق مغلق + اختبارات Room
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space (the emulator needs several GB for its userdata partition)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug + androidTest + release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4G
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/emulator_sms_test.sh

      - name: Upload evidence (screenshots, logcat, db, test reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            evidence
            app/build/reports/androidTests
          if-no-files-found: ignore

      # لقطات الشاشة التي يعرضها README: تُحفظ في المستودع عند أول تشغيل على main، أو عند التشغيل اليدوي مع الخيار.
      - name: Commit screenshots to docs/screenshots (main only)
        if: github.ref == 'refs/heads/main' && (github.event.inputs.update_screenshots == 'true' || hashFiles('docs/screenshots/home.png') == '')
        run: |
          mkdir -p docs/screenshots
          cp evidence/screens/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && echo "no screenshot changes" || { git commit -m "docs: لقطات الشاشة من المحاكي [skip ci]"; git push; }

  release:
    name: نشر الإصدار في صفحة Releases
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from app/build.gradle.kts
        id: v
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: masarif-apk
          path: out

      # الوسم يشير دائماً إلى آخر commit على main لنفس النسخة، فيُحدَّث الإصدار الموجود بدل إنشاء إصدار جديد
      - name: Point the version tag at this commit
        run: |
          git tag -f "v${{ steps.v.outputs.version }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/v${{ steps.v.outputs.version }}"

      - name: Create or update the GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: مصاريف v${{ steps.v.outputs.version }}
          files: out/masarif-release.apk
          body: |
            حمّل **masarif-release.apk** وثبّته على الجوال. خطوات التثبيت والإعداد في [README](https://github.com/${{ github.repository }}#readme).

            يدعم هذا الإصدار رسائل بنك الإنماء فقط.
